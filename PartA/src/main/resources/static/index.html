<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payroad Bargaining</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
    <div class="brand">Payroad</div>
    <div class="role-toggle" role="tablist">
        <button id="role-rider" class="role active" type="button">Rider</button>
        <button id="role-driver" class="role" type="button">Driver</button>
    </div>
    <label class="id-field">ID <input id="actor-id" type="text" value="R001" spellcheck="false"></label>
    <div id="conn" class="conn off">Disconnected</div>
</header>

<main class="layout">
    <div id="map"></div>

    <section class="panel">
        <!-- Rider -->
        <div id="rider-panel">
            <h2>New ride</h2>
            <div class="row">
                <label>From
                    <select id="preset-origin"></select>
                </label>
                <label>To
                    <select id="preset-dest"></select>
                </label>
            </div>
            <p class="hint">Or click the map twice: origin, then destination.</p>
            <p id="od-label" class="mono"></p>
            <button id="create-deal" class="primary" type="button">Create deal</button>

            <div id="rider-deal" class="hidden">
                <div id="rider-card" class="card"></div>

                <h3>Bids</h3>
                <div class="sort-toggle">
                    <button data-sort="price" class="sort active" type="button">Price</button>
                    <button data-sort="eta" class="sort" type="button">Fastest</button>
                    <button data-sort="recommended" class="sort" type="button">Recommended</button>
                </div>
                <table class="bids">
                    <thead><tr><th>Price</th><th>Pickup ETA</th><th>Pickup km</th><th>Driver</th><th></th></tr></thead>
                    <tbody id="bid-rows"></tbody>
                </table>

                <h3>Counter-offer</h3>
                <div class="row">
                    <input id="offer-price" type="number" step="1" min="0" placeholder="Price (₹)">
                    <button id="send-offer" type="button">Send offer</button>
                </div>
                <button id="cancel-deal" class="danger" type="button">Cancel deal</button>
            </div>
        </div>

        <!-- Driver -->
        <div id="driver-panel" class="hidden">
            <h2>Driver</h2>
            <p class="hint">Click the map to set your position.</p>
            <p id="driver-pos" class="mono"></p>
            <button id="go-online" class="primary" type="button">Go online</button>
            <p id="driver-status" class="mono"></p>

            <h3>Nearby deals</h3>
            <table class="market">
                <thead><tr><th>Deal</th><th>Base</th><th>Lowest bid</th><th>Rider offer</th><th>Bidders</th><th>Left</th></tr></thead>
                <tbody id="market-rows"></tbody>
            </table>

            <div id="driver-deal" class="hidden">
                <div id="driver-card" class="card"></div>
                <div class="row">
                    <input id="bid-price" type="number" step="1" min="0" placeholder="Bid (₹)">
                    <button id="send-bid" class="primary" type="button">Bid</button>
                    <button id="withdraw-bid" type="button">Withdraw</button>
                </div>
                <p id="bid-warning" class="warning hidden">R1: you can only lower your bid</p>
                <button id="accept-offer" class="hidden primary" type="button">Accept offer</button>
                <p id="driver-matched" class="mono"></p>
            </div>
        </div>

        <div id="banner" class="banner hidden"></div>
    </section>
</main>

<div id="toasts"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7/bundles/stomp.umd.min.js"></script>
<script src="app.js"></script>
</body>
</html>

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %msg%n"

spring:
  data:
    redis:
      host: localhost
      port: 6379
  datasource:
    url: jdbc:h2:file:./data/dynamicpayroad;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

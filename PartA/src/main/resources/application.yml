logging:
  pattern:
    console: "%d{HH:mm:ss} %msg%n"

spring:
  config:
    # Repo-root .env (gitignored) supplies ORS_API_KEY; the OS env var works too.
    import: optional:file:../.env[.properties]
  datasource:
    url: jdbc:h2:file:./data/dynamicpayroad;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  data:
    redis:
      url: redis://localhost:6379/0
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

ors:
  api-key: ${ORS_API_KEY:}

quote:
  # Part B /quote (plan v6 §3.4). No 200 within the timeout → fallback price, priceSource FALLBACK.
  base-url: http://127.0.0.1:8000
  timeout-ms: 2000

pricing:
  # The only source of the pricing constants (card B5, frozen). Relative to PartA/.
  constants-path: ../config/pricing-constants.json

presence:
  # R5: heartbeat TTL. Engaged users (api-spec §1.5) are kept past it by sweep.lua step 3.
  ttl-sec: 60

population:
  # api-spec §6.7: virtual users/drivers for the demo's supply-demand numbers. No deals, no DealHistory.
  enabled: true
  user-count: 1000
  driver-count: 200
  user-online-ratio: 0.05
  driver-online-ratio: 0.70
  churn-intensity: 0.05
  center-lat: 12.9716
  center-lng: 77.5946
  spread-deg: 0.1
  seed: 42
  heartbeat-sec: 20

admin:
  # Card E3: GET /api/admin/deal-history.csv exists only when true (pilot day: --admin.export-enabled=true).
  export-enabled: false

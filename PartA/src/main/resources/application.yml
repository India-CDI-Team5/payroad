logging:
  pattern:
    console: "%d{HH:mm:ss} %msg%n"

spring:
  config:
    # Repo-root .env (gitignored) supplies ORS_API_KEY; the OS env var works too.
    import: optional:file:../.env[.properties]
  datasource:
    url: jdbc:h2:file:./data/dynamicpayroad;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

ors:
  api-key: ${ORS_API_KEY:}

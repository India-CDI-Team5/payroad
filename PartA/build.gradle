plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.cdi'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    runtimeOnly 'com.h2database:h2'

    // JUnit 5, AssertJ and Mockito come with the starter, at versions managed by Spring Boot.
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Two classes have main() now; bootJar must start the web service.
springBoot {
    mainClass = 'com.cdi.dynamicpayroad.DynamicPayroadApplication'
}

// Experiment runner (card C1): ./gradlew runExperiment --args="--scenario smoke --seed 1". Needs Redis (DB 14).
tasks.register('runExperiment', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.cdi.dynamicpayroad.experiment.ExperimentRunner'
    workingDir = projectDir
}

test {
    useJUnitPlatform()
    // api-spec §6.1: JUnit uses Redis DB 15. Override with -PtestRedisUrl=redis://host:port/15.
    def testRedis = project.findProperty('testRedisUrl') ?: 'redis://localhost:6379/15'
    systemProperty 'spring.data.redis.url', testRedis
    systemProperty 'payroad.test.redis-url', testRedis
    systemProperty 'deal.sweeper.enabled', 'false'
    systemProperty 'spring.datasource.url', 'jdbc:h2:mem:payroad-test;DB_CLOSE_DELAY=-1'
}
